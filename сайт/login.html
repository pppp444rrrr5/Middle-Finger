<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">📚 ПрактикаGuide</a>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
            </nav>
        </div>
    </header>

    <main class="container form-page">
        <form id="loginForm" class="form-card" novalidate>
            <h2>Вход</h2>

            <label>
                Email
                <input type="email" name="email" required placeholder="student@example.com">
            </label>

            <label>
                Пароль
                <input type="password" name="password" required placeholder="Ваш пароль">
            </label>

            <div id="loginError" class="error"></div>
            <button type="submit" class="btn btn-primary full-width">Войти</button>

            <p class="form-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        </form>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
